<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/components.css" />
    <!-- JQuery Source -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <!-- Utily Functions-->
    <script src="./js/config.js" defer></script>
    <script src="./js/utils.js" defer></script>
    <script src="./js/jquery-utils.js" defer></script>
    <!-- Contact Form Component-->
    <script src="./js/components/contact-form.js" defer></script>
    <title>Contact Us</title>
</head>
<body>
    <section id="portfolio" class="portfolio-section">
        <div class="container">
            <h2>My Work</h2>
            <p class="section-subtitle">A selection of projects I've worked on</p>
            <div class="portfolio-filters">

            </div>
            <div class="portfolio-loading" style="display: none;">
                <div class="spinner"></div>
                <p>Loading Projects...</p>
            </div>
            <div class="portfolio-grid">

            </div>
        </div>
    </section>
    <section id="contact" class="contact-section">
        <div class="container">
            <h2>Get In Touch</h2>
            <form id="contact-form" class="contact-form" novalidate>
                <div class="form-group">
                    <label for="name">Name: </label>
                    <input type="text" id="name" name="name" autocomplete="name" required class="form-control" data-validation="required|min:2">
                    <div class="field-errors"></div>
                </div>

                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" autocomplete="email" class="form-control" data-validation="required|email">
                    <div class="field-errors"></div>
                </div>

                <div class="form-group">
                    <label for="message">Message: </label>
                    <textarea id="message" name="message" required class="form-control" rows="5" maxlength="500" data-validation="required|max:500"></textarea>
                    <div class="char-count">
                        <span id="char-counter">0</span> / 500 characters
                    </div>
                    <div class="field-errors"></div>
                </div>

                <div class="form-actions">
                    <button type="submit" id="submit-btn" class="btn btn-primary">
                        <span class="btn-text">Send Message</span>
                        <span class="btn-loading" style="display: none;">
                            <span class="spinner"></span> Sending...
                        </span>
                    </button>
                    <button type="reset" class="btn btn-secondary">Clear Form</button>
                </div>

                <div id="form-messages" class="form-messages"></div>
            </form>
        </div>
    </section>
    
</body>
</html>
